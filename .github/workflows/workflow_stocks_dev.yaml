        #     --kind functionapp
        #     # --query properties.outputs.fqdn




  # Below job was added after the function app was created
  az_python_code:
    name: 'Stock App deployment package'
    # if: ${{ github.event_name == 'push' }}
    if: ${{ github.event_name != 'workflow_dispatch' }}
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v5

      - name: 'Create AZ artifact folder'
        run: |
          mkdir artifact_source
          # cp source/azure/shared/*.* artifact_source/
          cp ${{ env.AZ_FUNC_APP_PROJECT_PATH }}/*.* artifact_source/
          cp -r ${{ env.AZ_FUNC_APP_PROJECT_PATH }}/shared artifact_source/shared/

      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AZ_FUNC_ARTIFACT }}
          path: |
            artifact_source

  az_function_deploy:
    name: 'Azure Function App Deploy'
    if: ${{ github.event_name != 'workflow_dispatch' }}
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    needs: az_python_code
    environment: development
    # permissions:
    #   id-token: write # Required for OIDC
    #   contents: read # Required for actions/checkout
    steps:
      - name: 'Download artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.AZ_FUNC_ARTIFACT }}

      - name: 'Display structure of downloaded files'
        run: ls -la

      - name: 'Azure CLI login'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUB_ID }}

      - name: 'Azure Function App config'
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az functionapp config appsettings set -g ${{ env.AZ_RG }} -n ${{ env.AZ_FUNC_APP }} --settings \
              TWELVEDATA_API_KEY="${{ secrets.TWELVEDATA_API_KEY }}"

      # Flex Consumption plan, remote-build: true is a MUST!
      - name: 'Azure Function App deployment'
        uses: azure/functions-action@v1
        id: deploy-to-function-app
        with:
          app-name: ${{ env.AZ_FUNC_APP }}
          remote-build: true

