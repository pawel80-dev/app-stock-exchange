name: 'Stock exchange monitor dev'

on:
  push:
    branches:
      - 'dev'

  # Workflow needs to be started manually
  workflow_dispatch:
    inputs:
      runtime_env:
        description: 'Stock exchange runtime env:'
        required: true
        default: 'Azure-Function'
        type: choice
        options:
          - Azure-Function
          - GC-Function

env:
  AZ_FUNC_ARTIFACT: 'fa-py-code-artifact'
  AZ_FUNC_APP: 'func-app-v2-dev' # set this to your function app name
  AZ_FUNC_APP_PROJECT_PATH: 'source/azure'
  AZ_RG: 'RG-TF-DEV-FUNC'

# In GitHub workflow, you should set permissions: with id-token: write at workflow level or job level 
permissions:
  contents: read  # Required for actions/checkout
  id-token: write # Required for OIDC

